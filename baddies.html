<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baddies Glam — Studio Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#ffe1ee; --blush-deep:#ffc4dc; --rose:#ee6aa7; --rose-deep:#d13c85;
    --plum:#4a2437; --gold:#e3a93f; --cream:#fff5fa; --line:rgba(209,60,133,0.22);
    --ok:#7a9a72; --pending:#e3a93f; --off:#9c8f92;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:linear-gradient(180deg,#fff5fa,#ffe9f3); background-attachment:fixed; color:var(--plum); font-family:'Jost',sans-serif; font-weight:300; line-height:1.55;}
  h1,h2,h3{font-family:'Cormorant Garamond',serif; font-weight:500; margin:0;}
  .wrap{max-width:960px; margin:0 auto; padding:0 24px 80px;}
  header.top{padding:28px 0 20px; margin-bottom:28px;}
  header.top .logo{font-family:'Cormorant Garamond',serif; font-size:1.5rem;}
  header.top .logo em{font-style:italic; color:var(--rose-deep);}
  header.top .tag{font-size:0.85rem; opacity:0.6; margin-top:4px;}
  .signout{float:right; font-size:0.8rem; color:var(--rose-deep); background:none; border:1px solid var(--rose-deep); border-radius:999px; padding:6px 16px; cursor:pointer;}

  .gate{max-width:380px; margin:80px auto; padding:36px 30px; background:#fff; border-radius:20px; box-shadow:0 14px 34px rgba(209,60,133,0.18); text-align:center;}
  .gate h1{font-size:1.8rem; margin-bottom:6px;}
  .gate p{opacity:0.65; font-size:0.9rem; margin-bottom:22px;}
  .gate input{width:100%; padding:12px 14px; margin-bottom:12px; border:1px solid var(--line); border-radius:12px; font-family:'Jost',sans-serif; font-size:0.95rem;}
  .gate button{width:100%; padding:13px; background:var(--rose-deep); color:#fff; border:none; border-radius:999px; font-size:0.95rem; cursor:pointer; font-family:'Jost',sans-serif;}
  .gate .err{color:#b33; font-size:0.85rem; margin-top:12px; min-height:1.2em;}

  .tabs{display:flex; gap:8px; margin-bottom:28px; flex-wrap:wrap;}
  .tabs button{padding:9px 20px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--plum); font-size:0.88rem; cursor:pointer; opacity:0.7; font-family:'Jost',sans-serif;}
  .tabs button.active{background:var(--rose-deep); color:#fff; border-color:var(--rose-deep); opacity:1;}
  .tabpanel{display:none;}
  .tabpanel.active{display:block;}

  .stats{display:flex; gap:16px; margin-bottom:30px; flex-wrap:wrap;}
  .stat{flex:1; min-width:110px; background:#fff; border:1px solid var(--line); padding:16px; border-radius:16px;}
  .stat .num{font-family:'Cormorant Garamond',serif; font-size:1.9rem; color:var(--rose-deep);}
  .stat .label{font-size:0.78rem; opacity:0.7;}

  .panel{border:1px solid var(--line); border-radius:18px; padding:24px; margin-bottom:28px; background:#fff;}
  .panel h2{font-size:1.3rem; margin-bottom:16px;}
  .addform{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .addform .full{grid-column:1/-1;}
  .field label{display:block; font-size:0.8rem; opacity:0.7; margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:12px; background:var(--cream); color:var(--plum); font-family:'Jost',sans-serif; font-size:0.92rem;}
  .field textarea{min-height:60px; resize:vertical;}
  .addform button{grid-column:1/-1; justify-self:start; padding:12px 28px; background:var(--rose-deep); color:#fff; border:none; border-radius:999px; cursor:pointer; font-family:'Jost',sans-serif; font-size:0.92rem;}

  .filters{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .filters button{padding:7px 16px; border:1px solid var(--line); background:#fff; color:var(--plum); border-radius:999px; font-size:0.8rem; cursor:pointer; opacity:0.7;}
  .filters button.active{background:var(--rose-deep); color:#fff; border-color:var(--rose-deep); opacity:1;}

  .card{border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:12px; display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; background:#fff;}
  .card .info{flex:1; min-width:200px;}
  .card .name{font-family:'Cormorant Garamond',serif; font-size:1.2rem;}
  .card .meta{font-size:0.82rem; opacity:0.7; margin-top:2px;}
  .card .notes{font-size:0.82rem; opacity:0.65; margin-top:6px; max-width:50ch;}
  .card .controls{display:flex; flex-direction:column; gap:7px; align-items:flex-end;}
  .status-pill{font-size:0.75rem; padding:4px 12px; border-radius:999px; color:#fff; white-space:nowrap;}
  .status-pending{background:var(--pending);} .status-confirmed{background:var(--ok);}
  .status-completed{background:var(--rose-deep);} .status-cancelled{background:var(--off);}
  .card select{padding:6px 10px; font-size:0.8rem; border:1px solid var(--line); border-radius:10px;}
  .pill-btn{font-size:0.75rem; padding:6px 13px; border:1px solid var(--rose-deep); color:var(--rose-deep); border-radius:999px; text-decoration:none; background:none; cursor:pointer;}
  .pill-btn:hover{background:var(--rose-deep); color:#fff;}
  .del-btn{background:none; border:none; color:var(--rose-deep); font-size:0.75rem; cursor:pointer; opacity:0.6; text-decoration:underline;}

  .svc-row{display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding:14px 0; gap:14px;}
  .svc-row .n{font-family:'Cormorant Garamond',serif; font-size:1.1rem;}
  .svc-row .d{font-size:0.8rem; opacity:0.65;}
  .svc-row .p{color:var(--rose-deep); font-style:italic;}

  .port-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px;}
  .port-item{border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--cream);}
  .port-item img{width:100%; aspect-ratio:1; object-fit:cover; display:block;}
  .port-item .cap{padding:8px 10px; font-size:0.78rem;}
  .port-item .acts{display:flex; justify-content:flex-end; padding:0 10px 10px;}

  .empty{text-align:center; padding:30px 20px; opacity:0.55; font-style:italic; font-family:'Cormorant Garamond',serif;}
</style>
</head>
<body>

<div id="app">
  <div class="gate"><h1>Loading…</h1></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script>
// ====== PASTE YOUR FIREBASE CONFIG HERE (same object used on the public site) ======
const firebaseConfig = {
  apiKey: "AIzaSyBIGeqCTtSRdQmCgCigb0yL2qAio0gDxNU",
  authDomain: "baddies-glam.firebaseapp.com",
  projectId: "baddies-glam",
  storageBucket: "baddies-glam.firebasestorage.app",
  messagingSenderId: "23026771816",
  appId: "1:23026771816:web:a18a2670bf651a5b49d8dd"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

const app = document.getElementById('app');

function escapeHtml(str){
  var d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function waLink(phone, name){
  var digits = (phone || '').replace(/[^\d]/g, '');
  if(digits.startsWith('0')) digits = '234' + digits.slice(1);
  var text = encodeURIComponent('Hi ' + (name || '') + ', this is Baddies Glam regarding your appointment — ');
  return 'https://wa.me/' + digits + '?text=' + text;
}

function showLogin(errorMsg){
  app.innerHTML =
    '<div class="gate">' +
      '<h1>Studio Dashboard</h1>' +
      '<p>Sign in to manage Baddies Glam</p>' +
      '<input type="email" id="loginEmail" placeholder="Email">' +
      '<input type="password" id="loginPass" placeholder="Password">' +
      '<button id="loginBtn">Sign In</button>' +
      '<div class="err">' + (errorMsg ? escapeHtml(errorMsg) : '') + '</div>' +
    '</div>';
  document.getElementById('loginBtn').addEventListener('click', function(){
    var email = document.getElementById('loginEmail').value.trim();
    var pass = document.getElementById('loginPass').value;
    auth.signInWithEmailAndPassword(email, pass).catch(function(err){
      showLogin(err.message);
    });
  });
}

auth.onAuthStateChanged(function(user){
  if(user){ renderDashboard(user); }
  else{ showLogin(); }
});

function renderDashboard(user){
  app.innerHTML = `
    <div class="wrap">
      <header class="top">
        <button class="signout" id="signoutBtn">Sign out</button>
        <div class="logo">Baddies <em>Glam</em></div>
        <div class="tag">Studio Dashboard — signed in as ${escapeHtml(user.email)}</div>
      </header>

      <div class="tabs">
        <button data-tab="bookings" class="active">Bookings</button>
        <button data-tab="services">Services</button>
        <button data-tab="portfolio">Portfolio</button>
      </div>

      <div class="tabpanel active" id="tab-bookings">
        <div class="stats" id="stats"></div>
        <div class="panel">
          <h2>Log a new booking</h2>
          <form class="addform" id="addBookingForm">
            <div class="field"><label>Client name</label><input type="text" id="f-name" required></div>
            <div class="field"><label>Phone / WhatsApp</label><input type="tel" id="f-phone" required></div>
            <div class="field">
              <label>Service</label>
              <select id="f-service">
                <option>Bridal Glam</option><option>Signature Glam</option>
                <option>Photoshoot Makeup</option><option>Makeup Lessons</option><option>Other</option>
              </select>
            </div>
            <div class="field"><label>Date</label><input type="date" id="f-date"></div>
            <div class="field full"><label>Notes</label><textarea id="f-notes"></textarea></div>
            <button type="submit">Add Booking</button>
          </form>
        </div>
        <div class="filters" id="filters">
          <button data-filter="all" class="active">All</button>
          <button data-filter="pending">Pending</button>
          <button data-filter="confirmed">Confirmed</button>
          <button data-filter="completed">Completed</button>
          <button data-filter="cancelled">Cancelled</button>
        </div>
        <div id="bookingList"><div class="empty">Loading…</div></div>
      </div>

      <div class="tabpanel" id="tab-services">
        <div class="panel">
          <h2>Add a service</h2>
          <form class="addform" id="addServiceForm">
            <div class="field"><label>Service name</label><input type="text" id="s-name" required></div>
            <div class="field"><label>Price (e.g. From ₦15,000)</label><input type="text" id="s-price" required></div>
            <div class="field full"><label>Description</label><textarea id="s-desc"></textarea></div>
            <button type="submit">Add Service</button>
          </form>
        </div>
        <div class="panel"><h2>Live on the public site</h2><div id="serviceList"></div></div>
      </div>

      <div class="tabpanel" id="tab-portfolio">
        <div class="panel">
          <h2>Add a work photo</h2>
          <form id="addPortForm" style="display:flex; flex-direction:column; gap:12px;">
            <div class="field"><label>Photo</label><input type="file" id="p-file" accept="image/*" required></div>
            <div class="field"><label>Caption</label><input type="text" id="p-caption"></div>
            <button type="submit" style="align-self:flex-start; padding:12px 28px; background:var(--rose-deep); color:#fff; border:none; border-radius:999px; cursor:pointer;">Add to Gallery</button>
          </form>
        </div>
        <div class="panel"><h2>Live on the public site</h2><div class="port-grid" id="portGrid"></div></div>
      </div>
    </div>
  `;

  document.getElementById('signoutBtn').addEventListener('click', function(){ auth.signOut(); });

  document.querySelectorAll('.tabs button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.tabpanel').forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('tab-' + btn.getAttribute('data-tab')).classList.add('active');
    });
  });

  // ---------- Bookings ----------
  var allBookings = [];
  var currentFilter = 'all';

  function renderBookings(){
    var pending = allBookings.filter(function(b){ return b.status === 'pending'; }).length;
    var confirmed = allBookings.filter(function(b){ return b.status === 'confirmed'; }).length;
    document.getElementById('stats').innerHTML =
      '<div class="stat"><div class="num">' + allBookings.length + '</div><div class="label">Total</div></div>' +
      '<div class="stat"><div class="num">' + pending + '</div><div class="label">Pending</div></div>' +
      '<div class="stat"><div class="num">' + confirmed + '</div><div class="label">Confirmed</div></div>';

    var listEl = document.getElementById('bookingList');
    var filtered = currentFilter === 'all' ? allBookings : allBookings.filter(function(b){ return b.status === currentFilter; });
    if(filtered.length === 0){ listEl.innerHTML = '<div class="empty">No bookings here yet.</div>'; return; }
    listEl.innerHTML = filtered.map(function(b){
      return '<div class="card" data-id="' + b.id + '">' +
        '<div class="info"><div class="name">' + escapeHtml(b.name || 'Unnamed') + '</div>' +
        '<div class="meta">' + escapeHtml(b.service || '') + (b.date ? ' · ' + escapeHtml(b.date) : '') + (b.phone ? ' · ' + escapeHtml(b.phone) : '') + '</div>' +
        (b.notes ? '<div class="notes">' + escapeHtml(b.notes) + '</div>' : '') + '</div>' +
        '<div class="controls"><span class="status-pill status-' + (b.status || 'pending') + '">' + (b.status || 'pending') + '</span>' +
        '<select class="status-select">' +
          '<option value="pending"' + (b.status === 'pending' ? ' selected' : '') + '>Pending</option>' +
          '<option value="confirmed"' + (b.status === 'confirmed' ? ' selected' : '') + '>Confirmed</option>' +
          '<option value="completed"' + (b.status === 'completed' ? ' selected' : '') + '>Completed</option>' +
          '<option value="cancelled"' + (b.status === 'cancelled' ? ' selected' : '') + '>Cancelled</option>' +
        '</select>' +
        (b.phone ? '<a class="pill-btn" href="' + waLink(b.phone, b.name) + '" target="_blank" rel="noopener">Reply on WhatsApp</a>' : '') +
        '<button class="del-btn">Remove</button></div></div>';
    }).join('');

    listEl.querySelectorAll('.card').forEach(function(card){
      var id = card.getAttribute('data-id');
      card.querySelector('.status-select').addEventListener('change', function(e){
        db.collection('bookings').doc(id).update({status: e.target.value}).catch(console.error);
      });
      card.querySelector('.del-btn').addEventListener('click', function(){
        if(!confirm('Remove this booking?')) return;
        db.collection('bookings').doc(id).delete().catch(console.error);
      });
    });
  }

  document.getElementById('filters').addEventListener('click', function(e){
    if(e.target.tagName !== 'BUTTON') return;
    document.querySelectorAll('#filters button').forEach(function(b){ b.classList.remove('active'); });
    e.target.classList.add('active');
    currentFilter = e.target.getAttribute('data-filter');
    renderBookings();
  });

  document.getElementById('addBookingForm').addEventListener('submit', function(e){
    e.preventDefault();
    db.collection('bookings').add({
      name: document.getElementById('f-name').value.trim(),
      phone: document.getElementById('f-phone').value.trim(),
      service: document.getElementById('f-service').value,
      date: document.getElementById('f-date').value,
      notes: document.getElementById('f-notes').value.trim(),
      status: 'pending', createdAt: Date.now()
    }).then(function(){ e.target.reset(); }).catch(console.error);
  });

  db.collection('bookings').orderBy('date', 'asc').onSnapshot(function(snap){
    allBookings = snap.docs.map(function(d){ return Object.assign({id: d.id}, d.data()); });
    renderBookings();
  }, console.error);

  // ---------- Services ----------
  document.getElementById('addServiceForm').addEventListener('submit', function(e){
    e.preventDefault();
    db.collection('services').add({
      name: document.getElementById('s-name').value.trim(),
      price: document.getElementById('s-price').value.trim(),
      desc: document.getElementById('s-desc').value.trim(),
      createdAt: Date.now()
    }).then(function(){ e.target.reset(); }).catch(console.error);
  });

  db.collection('services').orderBy('createdAt', 'asc').onSnapshot(function(snap){
    var el = document.getElementById('serviceList');
    if(snap.empty){ el.innerHTML = '<div class="empty">No services yet.</div>'; return; }
    el.innerHTML = snap.docs.map(function(d){
      var s = d.data();
      return '<div class="svc-row"><div><div class="n">' + escapeHtml(s.name) + '</div>' +
        (s.desc ? '<div class="d">' + escapeHtml(s.desc) + '</div>' : '') + '</div>' +
        '<div class="p">' + escapeHtml(s.price) + '</div>' +
        '<button class="del-btn" data-id="' + d.id + '">Remove</button></div>';
    }).join('');
    el.querySelectorAll('.del-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        if(!confirm('Remove this service?')) return;
        db.collection('services').doc(btn.getAttribute('data-id')).delete().catch(console.error);
      });
    });
  }, console.error);

  // ---------- Portfolio ----------
  document.getElementById('addPortForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var file = document.getElementById('p-file').files[0];
    var caption = document.getElementById('p-caption').value.trim();
    if(!file) return;
    try{
      var path = 'portfolio/' + Date.now() + '_' + file.name;
      var ref = storage.ref().child(path);
      await ref.put(file);
      var url = await ref.getDownloadURL();
      await db.collection('portfolio').add({url: url, path: path, caption: caption, createdAt: Date.now()});
      e.target.reset();
    }catch(err){ console.error(err); alert('Could not upload photo, try again.'); }
  });

  db.collection('portfolio').orderBy('createdAt', 'desc').onSnapshot(function(snap){
    var grid = document.getElementById('portGrid');
    if(snap.empty){ grid.innerHTML = '<div class="empty">No photos yet.</div>'; return; }
    grid.innerHTML = snap.docs.map(function(d){
      var p = d.data();
      return '<div class="port-item" data-id="' + d.id + '" data-path="' + escapeHtml(p.path || '') + '">' +
        '<img src="' + p.url + '" alt="">' +
        '<div class="cap">' + escapeHtml(p.caption || '') + '</div>' +
        '<div class="acts"><button class="del-btn">Remove</button></div></div>';
    }).join('');
    grid.querySelectorAll('.port-item').forEach(function(item){
      item.querySelector('.del-btn').addEventListener('click', async function(){
        if(!confirm('Remove this photo?')) return;
        var id = item.getAttribute('data-id');
        var path = item.getAttribute('data-path');
        try{
          if(path) await storage.ref().child(path).delete();
          await db.collection('portfolio').doc(id).delete();
        }catch(err){ console.error(err); }
      });
    });
  }, console.error);
}
</script>

</body>
</html>
